[mgr]
# Give the preview pane more room; useful for PDF/image previews.
ratio = [1, 2, 5]

[preview]
# Leave a short settling interval before drawing image previews.
max_width = 2560
max_height = 1440
image_delay = 100
image_quality = 80
image_filter = "triangle"

[opener]
noop = [{ run = "true" }]
ropen = [{ run = 'ropen "$@"', desc = "Open with ropen" }]

[open]
prepend_rules = [
  { mime = "application/pdf", use = "ropen" },
  { mime = "image/*", use = "ropen" },
  { url = "*.pdf", use = "ropen" },
]
